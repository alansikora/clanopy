name: 'Clanopy PR Review'
description: 'AI-powered PR review using Claude Code'
branding:
  icon: 'eye'
  color: 'green'

inputs:
  claude_code_oauth_token:
    description: 'Claude access token (from /install-github-app). Preferred over api_key.'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key (alternative to access token)'
    required: false
  config_path:
    description: 'Path to .clanopy/review.yml'
    required: false
    default: '.clanopy/review.yml'
  post_comment:
    description: 'Post findings as PR comment'
    required: false
    default: 'true'
  clanopy_version:
    description: 'Clanopy CLI version to install (e.g. "v0.3.0", "canary"). Defaults to latest release.'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install clanopy
      shell: bash
      env:
        CLANOPY_VERSION: ${{ inputs.clanopy_version }}
      run: |
        ARGS=()
        if [ "$CLANOPY_VERSION" != "latest" ]; then
          ARGS+=(--version "$CLANOPY_VERSION")
        fi
        curl -fsSL https://raw.githubusercontent.com/alansikora/clanopy/main/install.sh | sh -s -- "${ARGS[@]}"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Claude Code
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code

    - name: Generate review token
      id: review-token
      shell: bash
      run: |
        # Request OIDC token from GitHub Actions (requires id-token: write permission).
        if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          echo "::error::OIDC not available. Add 'id-token: write' permission to your workflow and install the Clanopy Review app."
          exit 1
        fi
        OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=clanopy" | jq -r '.value')
        if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
          echo "::error::Failed to obtain OIDC token."
          exit 1
        fi
        # Exchange OIDC token for a GitHub App installation token.
        RESPONSE=$(curl -sS -X POST https://token.clanopy.workers.dev/token \
          -H "Authorization: Bearer $OIDC_TOKEN" \
          -H "Content-Type: application/json")
        TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
        if [ -n "$TOKEN" ]; then
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
        else
          ERROR=$(echo "$RESPONSE" | jq -r '.error // "unknown error"')
          echo "::error::Failed to get Clanopy Review app token: $ERROR. Install the app at https://github.com/apps/clanopy-review"
          exit 1
        fi

    - name: Run review
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ steps.review-token.outputs.token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        POST_FLAG=""
        if [ "${{ inputs.post_comment }}" = "true" ]; then
          POST_FLAG="--post"
        fi
        clanopy review "$PR_NUMBER" \
          --repo "$REPO" \
          --config "${{ inputs.config_path }}" \
          $POST_FLAG
