name: 'Clanopy PR Review'
description: 'AI-powered PR review using Claude Code'
branding:
  icon: 'eye'
  color: 'green'

inputs:
  claude_code_oauth_token:
    description: 'Claude access token (from /install-github-app). Preferred over api_key.'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key (alternative to access token)'
    required: false
  config_path:
    description: 'Path to .clanopy/review.yml'
    required: false
    default: '.clanopy/review.yml'
  github_token:
    description: 'GitHub token with pull-requests:write for resolving review threads. Defaults to github.token. Use a PAT if auto-resolve fails.'
    required: false
    default: '${{ github.token }}'
  post_comment:
    description: 'Post findings as PR comment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install clanopy
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/alansikora/clanopy/main/install.sh | sh -s -- --version v0.1.3
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Claude Code
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code

    - name: Run review
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        POST_FLAG=""
        if [ "${{ inputs.post_comment }}" = "true" ]; then
          POST_FLAG="--post"
        fi
        clanopy review "$PR_NUMBER" \
          --repo "$REPO" \
          --config "${{ inputs.config_path }}" \
          $POST_FLAG
