name: Canary

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "action.yml"

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp action.yml and publish canary
        run: |
          sed -i 's#install.sh | sh#install.sh | sh -s -- --canary#' action.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "stamp canary action"
          git tag -f canary
          git push -f origin canary

          gh release delete canary --yes 2>/dev/null || true
          gh release create canary dist/*.tar.gz dist/checksums.txt \
            --title "Canary ($(git rev-parse --short HEAD~1))" \
            --notes "Latest build from \`main\` — commit $(git rev-parse --short HEAD~1). Not a stable release." \
            --prerelease \
            --target canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
